<!DOCTYPE html>
<html>
<head>
    <title>Додати | PC</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c2c2c; color: white; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: #3d3d3d; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #555; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#28a745">Новий девайс</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input name="name" placeholder="Назва" required>
            <select name="category">
                {% for code, name in categories %}
                    <option value="{{ code }}">{{ name }}</option>
                {% endfor %}
            </select>
            <input name="price" type="number" step="0.01" placeholder="Ціна (грн)" required>
            <input type="file" name="image">
            <button type="submit">Зберегти</button>
        </form>
        <a href="/" style="color: #aaa; text-decoration: none; display: block; text-align: center; margin-top: 15px;">← Скасувати</a>
    </div>
</body>
</html>
