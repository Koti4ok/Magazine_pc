<!DOCTYPE html>
<html>
<head>
    <title>Вхід | PC Store</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c2c2c; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #3d3d3d; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; text-align: center; border: 1px solid #444; }
        h2 { margin-bottom: 25px; color: #00d4ff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #555; color: white; box-sizing: border-box; outline: none; }
        input:focus { background: #666; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; margin-top: 15px; }
        button:hover { background: #0056b3; }
        .back-link { display: block; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 0.9rem; }
        .error { color: #ff6b6b; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вхід</h2>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="error">Невірний логін або пароль</div>
            {% endif %}
            <input type="text" name="username" placeholder="Логін" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Увійти</button>
        </form>
        <a href="/" class="back-link">← На головну</a>
    </div>
</body>
</html>
